# Forge Table for a group: oauth2-proxy signs people in with your OIDC provider and is the only thing that can reach
# Forge Table, on a private network. Put your usual TLS terminator in front of 127.0.0.1:4180.
# The proxy is the login: it sets the user header on every request it forwards, and forge-table:8790 is never
# published (no ports:), so nothing else can claim to be a user. Keep other containers off the "table" network.
# Before you start: build the image (docs/forge-table/install.md), replace the example.com URLs, register a client
# "forge-table" with your OIDC provider, and create oauth2-proxy.env next to this file with
#   OAUTH2_PROXY_CLIENT_SECRET=...
#   OAUTH2_PROXY_COOKIE_SECRET=...   (32 random bytes: openssl rand -base64 32 | tr -- '+/' '-_')
# Then: docker compose up -d. Run the checks in docs/forge-table/hosting.md before you open it up.
# For yourself alone, with no login, use compose.solo.yaml instead.
services:
  forge-table:
    image: forge-table
    restart: unless-stopped
    environment:
      FT_TRUST_PROXY_HEADER: X-Forwarded-User
      FT_NAME_HEADER: X-Forwarded-Preferred-Username
      FT_GROUPS_HEADER: X-Forwarded-Groups
      FT_ADMIN_GROUP: forge-table-admins
      FT_MAX_MATCHES: "4"
      # FT_PUBLIC_URL: https://forge.example.com
    volumes:
      - forge-table-data:/data
    networks: [table]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --upstream=http://forge-table:8790
      - --provider=oidc
      - --oidc-issuer-url=https://login.example.com
      - --redirect-url=https://forge.example.com/oauth2/callback
      - --email-domain=*
    environment:
      OAUTH2_PROXY_CLIENT_ID: forge-table
    env_file: oauth2-proxy.env
    ports: ["127.0.0.1:4180:4180"]
    networks: [table]

networks:
  table: {}
volumes:
  forge-table-data: {}
