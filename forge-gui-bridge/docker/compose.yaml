# Forge Table's own accounts, with Caddy handling HTTPS. No login provider or cookie secret to configure.
# Copy compose-settings.example to .env and set FT_DOMAIN to your public DNS name, then: docker compose up -d
# See docs/forge-table/install.md. Only Caddy publishes ports. Keep other containers off the "table" network,
# and never publish 8790 or 8799. An existing oauth2-proxy setup can keep using compose.oidc.yaml instead.
services:
  forge-table:
    image: ${FORGE_TABLE_IMAGE:-ghcr.io/mdbook/forge-table:edge}
    restart: unless-stopped
    environment:
      FT_AUTH: users
      FT_REAL_IP_HEADER: X-Real-IP
      FT_MAX_MATCHES: "1"
    volumes:
      - forge-table-data:/data
    networks: [table]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [forge-table]
    environment:
      FT_DOMAIN: ${FT_DOMAIN:?Set FT_DOMAIN to your public DNS name in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [table]

networks:
  table: {}
volumes:
  forge-table-data: {}
  caddy-data: {}
  caddy-config: {}
