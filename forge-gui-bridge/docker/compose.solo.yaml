# Forge Table for yourself alone, with no login: the server listens on the host's loopback only (Linux).
#   docker compose -f compose.solo.yaml up -d
#   docker compose -f compose.solo.yaml logs forge-table | grep FORGE_TABLE_READY
# and open the url from that line (it ends in #t=<token>). To play with friends, use compose.yaml instead.
# Docker Desktop users should use compose.yaml too; host networking here is Linux-only.
services:
  forge-table:
    image: ${FORGE_TABLE_IMAGE:-ghcr.io/mdbook/forge-table:edge}
    restart: unless-stopped
    network_mode: host
    environment:
      FT_BIND: 127.0.0.1
    volumes:
      - forge-table-data:/data
volumes:
  forge-table-data: {}
